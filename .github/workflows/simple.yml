name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'   # triggers when you push a version tag like v1.2.3

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/my-image:${{ env.VERSION }} \
            -t ${{ secrets.DOCKER_USERNAME }}/my-image:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-image:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/my-image:latest
